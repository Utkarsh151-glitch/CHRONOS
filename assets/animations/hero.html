<!doctype html>
<html><head><meta charset="utf-8"><style>
/*__CSS__*/
html,body{height:100%}
#c{position:absolute;inset:0;width:100%;height:100%}
.stage{position:relative;height:100%;overflow:hidden;border-radius:24px;
  background:radial-gradient(ellipse at 50% 55%,#0e1b45 0%,#060a1c 45%,#02030a 100%)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(56,232,255,.25);transform:translate(-50%,-50%)}
.r1{width:420px;height:420px;animation:spin 40s linear infinite;border-style:dashed}
.r2{width:560px;height:560px;border-color:rgba(255,157,60,.18);animation:spin 70s linear infinite reverse}
.r3{width:300px;height:300px;border-color:rgba(166,107,255,.35);animation:spin 25s linear infinite;border-top-color:rgba(166,107,255,.9)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.kicker{font-family:Orbitron;font-size:12px;letter-spacing:.6em;color:var(--orange);opacity:0;animation:fade 1.2s .3s forwards}
h1{font-family:Orbitron;font-weight:900;font-size:clamp(54px,9vw,112px);letter-spacing:.32em;margin:10px 0 0 .32em;
  background:linear-gradient(180deg,#ffffff 10%,#9eefff 55%,#38a8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(56,232,255,.45));opacity:0;animation:rise 1.6s .5s forwards}
.sub{font-family:Orbitron;font-size:clamp(13px,1.6vw,18px);letter-spacing:.55em;color:#cfe8ff;opacity:0;animation:fade 1.2s 1.3s forwards}
.q{margin-top:34px;font-size:clamp(16px,1.9vw,22px);font-weight:300;color:#e6f1ff;font-style:italic;opacity:0;animation:fade 1.4s 2s forwards}
.tag2{margin-top:12px;font-size:13px;color:var(--muted);letter-spacing:.08em;opacity:0;animation:fade 1.4s 2.4s forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px);letter-spacing:.6em}to{opacity:1;transform:none}}
.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(56,232,255,.5),transparent);animation:scan 6s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
</style></head><body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="ring r2"></div><div class="ring r1"></div><div class="ring r3"></div>
  <div class="scan"></div>
  <div class="content">
    <div class="kicker">A DEEP LEARNING EXPEDITION</div>
    <h1>CHRONOS</h1>
    <div class="sub">INSIDE THE MEMORY OF AI</div>
    <div class="q">"Can a neural network remember the past to predict the future?"</div>
    <div class="tag2">Every sequence has a past. Every prediction has a memory.</div>
  </div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H; function rs() { W = cv.width = cv.offsetWidth * devicePixelRatio; H = cv.height = cv.offsetHeight * devicePixelRatio; } rs(); addEventListener('resize', rs);
const stars = Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() }));
const nodes = Array.from({ length: 18 }, (_, k) => ({ a: k / 18 * Math.PI * 2, r: .1 + .08 * (k % 3), s: .0015 + .001 * (k % 4) }));
const flow = Array.from({ length: 70 }, () => ({ x: Math.random(), v: .0008 + Math.random() * .0016, y: .86 + (Math.random() - .5) * .04 }));
function wave(x, t) { return Math.sin(x * 26 + t * .8) * .018 + Math.sin(x * 7 - t * .3) * .01; }
function draw(ts) {
  const t = ts / 1000; ctx.clearRect(0, 0, W, H);
  for (const s of stars) { s.x -= .00006 * (1 + s.z * 3); if (s.x < 0) s.x = 1;
    ctx.fillStyle = `rgba(200,225,255,${.25 + .6 * s.z * (0.6 + 0.4 * Math.sin(t * 2 + s.y * 40))})`;
    ctx.fillRect(s.x * W, s.y * H, 1 + s.z * 1.6, 1 + s.z * 1.6); }
  // neural constellation
  const cx = W / 2, cy = H / 2, R = Math.min(W, H);
  const pts = nodes.map(n => { n.a += n.s; return [cx + Math.cos(n.a) * n.r * R * 1.6, cy + Math.sin(n.a) * n.r * R]; });
  ctx.lineWidth = 1;
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
    if (d < R * .22) { ctx.strokeStyle = `rgba(120,140,255,${.22 * (1 - d / (R * .22))})`; ctx.beginPath(); ctx.moveTo(...pts[i]); ctx.lineTo(...pts[j]); ctx.stroke(); }
  }
  for (const [x, y] of pts) { const g = ctx.createRadialGradient(x, y, 0, x, y, 9); g.addColorStop(0, 'rgba(166,107,255,.9)'); g.addColorStop(1, 'rgba(166,107,255,0)'); ctx.fillStyle = g; ctx.fillRect(x - 9, y - 9, 18, 18); }
  // timeline of data flowing into the future
  ctx.strokeStyle = 'rgba(56,232,255,.35)'; ctx.lineWidth = 1.5 * devicePixelRatio; ctx.beginPath();
  for (let k = 0; k <= 200; k++) { const x = k / 200; const y = .86 + wave(x, t); k ? ctx.lineTo(x * W, y * H) : ctx.moveTo(x * W, y * H); } ctx.stroke();
  for (const p of flow) { p.x += p.v; if (p.x > 1) p.x = 0; const y = (.86 + wave(p.x, t)) * H, x = p.x * W;
    const col = p.x > .5 ? '255,157,60' : '56,232,255';
    const g = ctx.createRadialGradient(x, y, 0, x, y, 7 * devicePixelRatio); g.addColorStop(0, `rgba(${col},.95)`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - 10 * devicePixelRatio, y - 10 * devicePixelRatio, 20 * devicePixelRatio, 20 * devicePixelRatio); }
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = `${10 * devicePixelRatio}px Orbitron, sans-serif`;
  ctx.fillText('PAST', W * .03, H * .95); ctx.fillText('NOW', W * .49, H * .95); ctx.fillText('FUTURE', W * .92, H * .95);
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(W * .5, H * .78); ctx.lineTo(W * .5, H * .92); ctx.stroke(); ctx.setLineDash([]);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
