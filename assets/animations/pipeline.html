<!doctype html>
<html><head><meta charset="utf-8"><style>
/*__CSS__*/
svg{width:100%;height:auto;display:block}
.n{font-family:Orbitron;font-size:13px;letter-spacing:.14em;fill:#fff;text-anchor:middle}
.d{font-size:12.5px;fill:#9fb3dc;text-anchor:middle}
.pulse{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
</style></head><body>
<div class="panel" style="padding:8px">
<svg viewBox="0 0 1000 250">
  <defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <path id="p" d="M 130 110 C 240 60, 290 160, 380 110 S 560 60, 620 110 S 780 160, 870 110"/></defs>
  <use href="#p" fill="none" stroke="rgba(56,232,255,.25)" stroke-width="3"/>
  <!-- past -->
  <g><polyline points="60,130 72,100 84,118 96,86 108,104 120,78 132,96" fill="none" stroke="#38e8ff" stroke-width="3" filter="url(#gl)"/>
    <text class="n" x="96" y="180">PAST DATA</text><text class="d" x="96" y="202">24 hours of demand</text></g>
  <!-- network -->
  <g><circle cx="380" cy="110" r="44" fill="rgba(166,107,255,.12)" stroke="#a66bff" stroke-width="2" class="pulse" filter="url(#gl)"/>
    <circle cx="364" cy="96" r="6" fill="#a66bff"/><circle cx="396" cy="96" r="6" fill="#a66bff"/><circle cx="380" cy="126" r="6" fill="#a66bff"/>
    <line x1="364" y1="96" x2="396" y2="96" stroke="#a66bff"/><line x1="364" y1="96" x2="380" y2="126" stroke="#a66bff"/><line x1="396" y1="96" x2="380" y2="126" stroke="#a66bff"/>
    <text class="n" x="380" y="180">LSTM NETWORK</text><text class="d" x="380" y="202">gates read each hour</text></g>
  <!-- memory -->
  <g><rect x="580" y="84" width="80" height="52" rx="12" fill="rgba(255,210,122,.1)" stroke="#ffd27a" stroke-width="2" class="pulse" filter="url(#gl)"/>
    <text x="620" y="116" text-anchor="middle" fill="#ffd27a" font-family="JetBrains Mono" font-size="18">c, h</text>
    <text class="n" x="620" y="180">MEMORY</text><text class="d" x="620" y="202">cell + hidden state</text></g>
  <!-- future -->
  <g><circle cx="890" cy="110" r="30" fill="rgba(255,157,60,.15)" stroke="#ff9d3c" stroke-width="2" filter="url(#gl)" class="pulse"/>
    <text x="890" y="116" text-anchor="middle" fill="#ff9d3c" font-family="Orbitron" font-size="16">ŷ</text>
    <text class="n" x="890" y="180">FUTURE</text><text class="d" x="890" y="202">next-hour forecast</text></g>
  <g id="dots"></g>
  <text x="500" y="240" text-anchor="middle" font-size="11" fill="#8aa0c8">conceptual animation · information flows left → right</text>
</svg></div>
<script>
const g = document.getElementById('dots'), NS = 'http://www.w3.org/2000/svg';
for (let k = 0; k < 14; k++) {
  const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 4); c.setAttribute('filter', 'url(#gl)');
  c.setAttribute('fill', k % 3 === 0 ? '#ff9d3c' : '#38e8ff');
  const m = document.createElementNS(NS, 'animateMotion'); m.setAttribute('dur', '4.2s'); m.setAttribute('repeatCount', 'indefinite');
  m.setAttribute('begin', `${-k * 0.3}s`); const mp = document.createElementNS(NS, 'mpath'); mp.setAttribute('href', '#p');
  m.appendChild(mp); c.appendChild(m); g.appendChild(c);
}
</script></body></html>
